name: Comprobar enlaces a Microsoft Learn

on:
  schedule:
    - cron: '17 6 * * 1' # cada lunes
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-links
