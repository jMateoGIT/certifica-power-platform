<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Prepara las certificaciones de Microsoft Power Platform en español: tests por dominio, simulacros cronometrados y la explicación de cada respuesta." />
    <meta name="theme-color" content="#5b3cc4" />
    <title>Certifica Power Platform</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeos.
      try {
        var t = JSON.parse(localStorage.getItem('certifica-pp:v1') || '{}').state?.theme || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
